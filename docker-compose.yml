# Full stack: Postgres + Elasticsearch + data pipeline + API + web.
#   cp .env.example .env      # optional: add an OpenAlex API key
#   docker compose up --build
#   open http://localhost:8080
name: openalex-climate-dk

x-backend-env: &backend-env
  DATABASE_URL: postgresql://openalex:${POSTGRES_PASSWORD:-openalex}@postgres:5432/openalex
  ELASTICSEARCH_URL: http://elasticsearch:9200
  OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
  HARVEST_LIMIT: ${HARVEST_LIMIT:-1000}
  SNAPSHOT_PATH: data/works.jsonl.gz

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openalex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openalex}
      POSTGRES_DB: openalex
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # local access for development/analysis only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openalex -d openalex"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:9.2.1
    environment:
      discovery.type: single-node
      # Local/demo setting. In production enable security (TLS + auth), see README.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # One-shot job: create the schema, seed Postgres (bundled snapshot, or a live harvest if
  # the snapshot is missing) and build the search index if it doesn't exist yet.
  pipeline:
    build: ./backend
    command: ["python", "-m", "app.cli", "bootstrap"]
    environment: *backend-env
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    environment: *backend-env
    depends_on:
      pipeline:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  esdata:
